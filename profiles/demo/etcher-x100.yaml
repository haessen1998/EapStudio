apiVersion: eapstudio/v1alpha1
kind: EquipmentProfile

metadata:
  name: demo-etcher-x100
  vendor: EapStudio Demo
  model: X100
  version: 1.0.0
  adapter: generic-gem

spec:
  variables:
    101:
      name: LotId
      type: A
      description: Lot identifier
    102:
      name: WaferId
      type: A
      description: Wafer identifier
    103:
      name: Recipe
      type: A
      description: Active process recipe
    201:
      name: MaterialId
      type: A
      description: Arriving material identifier
    202:
      name: RequestedRecipe
      type: A
      description: Recipe required by the material
    203:
      name: PortId
      type: A
      description: Load port identifier

  reports:
    2001:
      name: WaferInfo
      variables: [101, 102, 103]
    2101:
      name: MaterialArrival
      variables: [201, 202, 203]

  events:
    1001:
      name: wafer.started
      displayName: Wafer started
      reports: [2001]
      mapping:
        lotId:
          report: 2001
          variable: 101
        waferId:
          report: 2001
          variable: 102
        recipe:
          report: 2001
          variable: 103

    1101:
      name: material.arrived
      displayName: Material arrived
      reports: [2101]
      mapping:
        materialId:
          report: 2101
          variable: 201
        recipeId:
          report: 2101
          variable: 202
        portId:
          report: 2101
          variable: 203

  commands:
    send.recipe:
      displayName: Send recipe
      stream: 7
      function: 3
      wait: true
      parameters: [recipeId, materialId]
      successEvent: recipe.sent
      failureEvent: recipe.failed
      successAck: 0

  simulator:
    scenarios:
      material-arrival:
        displayName: Material arrival
        event: material.arrived
        data:
          materialId: MAT-${sequence}
          recipeId: ETCH-A
          portId: LP01
      wafer-start:
        displayName: Wafer start
        event: wafer.started
        data:
          lotId: LOT-${sequence}
          waferId: WAFER-${sequence}
          recipe: ETCH-A
      alarm-raised:
        displayName: Alarm raised
        direction: inbound
        message:
          stream: 5
          function: 1
          wait: true
          sml: |
            S5F1 W
            <L[3]
              <B 128>
              <U4 7001>
              <A "Chamber pressure high">
            >
            .
          fields:
            alarmId: "7001"
            code: "128"
            text: Chamber pressure high
            severity: critical
            active: true
      alarm-cleared:
        displayName: Alarm cleared
        direction: inbound
        message:
          stream: 5
          function: 1
          wait: true
          sml: |
            S5F1 W
            <L[3]
              <B 0>
              <U4 7001>
              <A "Chamber pressure normal">
            >
            .
          fields:
            alarmId: "7001"
            code: "0"
            text: Chamber pressure normal
            severity: critical
            active: false
      remote-command:
        displayName: Execute remote command
        direction: outbound
        message:
          stream: 2
          function: 41
          wait: true
          sml: |
            S2F41 W
            <L[2]
              <A "START">
              <L[0]>
            >
            .
      recipe-download:
        displayName: Download recipe
        direction: outbound
        message:
          stream: 7
          function: 3
          wait: true
          sml: |
            S7F3 W
            <L[2]
              <A "ETCH-A">
              <B 01 02 03 04>
            >
            .
