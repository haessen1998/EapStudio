routes:
  - name: production-events
    match:
      names:
        - wafer.*
        - material.*
        - recipe.*
        - alarm.*
      equipment:
        - ETCHER-*
    sinks:
      - mock-mq
      - sqlite-history

  - name: unknown-secs-events
    match:
      names:
        - secs.unknown
      equipment:
        - ETCHER-*
    sinks:
      - sqlite-history
